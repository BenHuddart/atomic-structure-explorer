name: Documentation screenshots

on:
  workflow_dispatch:
    inputs:
      commit_changes:
        description: Commit regenerated screenshots to the current branch
        required: true
        type: boolean
        default: false
  pull_request:
    paths:
      - "src/**"
      - "scripts/capture_screenshots.py"
      - ".github/workflows/screenshots.yml"

jobs:
  preview:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Generate screenshots
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/capture_screenshots.py
      - name: Upload screenshots for review
        uses: actions/upload-artifact@v4
        with:
          name: documentation-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 1

  update:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Generate screenshots
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/capture_screenshots.py
      - name: Upload screenshots for review
        uses: actions/upload-artifact@v4
        with:
          name: documentation-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 1
      - name: Commit regenerated screenshots
        if: inputs.commit_changes
        shell: bash
        run: |
          if git diff --quiet -- docs/screenshots; then
            echo "Screenshots are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "docs: refresh application screenshots"
          git push
