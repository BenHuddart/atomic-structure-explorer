[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "atomic_structure_explorer"
version = "0.1.0"
description = "Interactive undergraduate atomic-structure teaching application"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "PySide6>=6.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]
release = ["pyinstaller>=6.0", "pillow>=11.0"]

[project.scripts]
atomic_structure_explorer = "atomic_structure_explorer.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atomic_structure_explorer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
